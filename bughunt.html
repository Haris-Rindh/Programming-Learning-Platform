<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug Hunting Arena - CosmicCode</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/bughunt.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Stars Background -->
  <div class="stars-bg" id="stars"></div>

  <!-- Header Deck -->
  <header style="height: 70px; border-bottom: 1px solid var(--border-light); background: rgba(13, 15, 34, 0.6); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 0 24px; z-index: 10;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="dashboard.html" class="btn btn-muted" style="padding: 6px 14px; font-size: 0.85rem;">
        ← Back to Hub
      </a>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-display); font-weight: 500;">GAME SYSTEM CORE</span>
        <span style="font-size: 1.1rem; font-weight: 600; color: #fff;">Bug Hunting Arena</span>
      </div>
    </div>
    
    <div style="display: flex; align-items: center; gap: 20px;">
      <span class="badge-ui" style="color: var(--accent-pink); border-color: rgba(255,0,127,0.2);">High Score: <strong id="game-highscore">0</strong></span>
    </div>
  </header>

  <!-- Game Arena Deck -->
  <main class="dashboard-deck animate-fade-in" style="margin-top: 20px;">
    
    <!-- LEFT SIDE: Game controls & Mascot dialogue -->
    <div>
      
      <!-- Stats panel card -->
      <section class="panel profile-card" style="padding: 24px;">
        <h3 style="font-size: 1.1rem; color: #fff; margin-bottom: 16px;">Arena Diagnostic Dashboard</h3>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <span style="font-size: 0.9rem; color: var(--text-secondary);">Structural Core Health:</span>
          <div id="game-hearts" class="hearts-container">❤️ ❤️ ❤️</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <span style="font-size: 0.9rem; color: var(--text-secondary);">Zapped Score:</span>
          <span id="game-score" style="font-family: var(--font-display); font-size: 1.4rem; font-weight: bold; color: var(--accent-cyan);">0</span>
        </div>

        <div style="margin-top: 10px;">
          <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">
            <span>Sector Overheat Limit</span>
            <span>30s Max</span>
          </div>
          <div class="timer-track">
            <div class="timer-bar" id="game-timer-bar"></div>
          </div>
        </div>
      </section>

      <!-- Mascot Guidance Node -->
      <section class="panel companion-card">
        <div class="bubble-dialogue" id="game-mascot-bubble">
          Loading targeting arrays...
        </div>
        <div id="game-mascot" style="position: relative; margin-top: 10px;"></div>
        <h3 style="font-size: 1rem; color: #fff;">Byte</h3>
        <p style="font-size: 0.75rem; color: var(--text-secondary);">Arena Operator Node</p>
      </section>

    </div>

    <!-- RIGHT SIDE: Coded terminal playground -->
    <div>
      
      <section class="terminal-arena">
        <div class="terminal-header">
          <span id="game-level-title">Scanning sector levels...</span>
          <span class="badge-ui badge-cyan" style="font-size:0.65rem;">LASER LINKACTIVE</span>
        </div>
        <div class="code-board" id="game-code-board">
          <!-- Populated lines -->
        </div>
      </section>

    </div>

  </main>

  <!-- Scripts -->
  <script src="js/state.js"></script>
  <script src="js/mascot-svg.js"></script>
  <script src="js/bughunt-game.js"></script>
  <script>
    // Create background stars
    const starsContainer = document.getElementById("stars");
    for (let i = 0; i < 40; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.width = Math.random() * 3 + "px";
      star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + "vw";
      star.style.top = Math.random() * 100 + "vh";
      star.style.animationDelay = Math.random() * 5 + "s";
      starsContainer.appendChild(star);
    }

    // Launch Arena
    Mascot.render("game-mascot", "idle");
    window.launchBugHunt();
  </script>
</body>
</html>
